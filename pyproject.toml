[project]
name = "annif"
version = "1.5.0-dev"
description = "Automated subject indexing and classification tool"
authors = [{ name = "National Library of Finland", email = "finto-posti@helsinki.fi" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "Apache-2.0"
maintainers = [
    { name = "Osma Suominen", email = "osma.suominen@helsinki.fi" },
    { name = "Juho Inkinen", email = "juho.inkinen@helsinki.fi" },
    { name = "Mona Lehtinen", email = "mona.lehtinen@helsinki.fi" },
]
keywords = [
    "machine-learning",
    "text-classification",
    "multilabel-classification",
    "rest-api",
    "code4lib",
    "subject-indexing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "click~=8.5.0",
    "click-log==0.4.*",
    "connexion[flask, uvicorn, swagger-ui]~=3.3.0",
    "gunicorn~=26.2.0",
    "huggingface-hub~=1.32.0",
    "joblib~=1.6.0",
    "jsonschema~=4.26.0",
    "nltk~=3.10.3",
    "numpy~=2.4.6",
    "optuna~=5.0.0",
    "python-dateutil==2.9.*",
    "simplemma~=2.0.0",
    "scikit-learn~=1.9.1",
    "scipy~=1.17.1",
    "starlette~=1.6.0",
    "requests~=2.34.2",
    "rdflib~=7.6.0",
]

[project.optional-dependencies]
fasttext = ["fasttext-numpy2==0.10.4"]
ebm-api= ["ebm4subjects==0.5.6"]
ebm-in-process = ["ebm4subjects[in-process]==0.5.6"]
estnltk = ["estnltk==1.7.5"]
nn = [
    "torch~=2.14.0",
    "tqdm~=4.70.1",
    "lmdb~=2.3.0",
]
torch-cpu = ["torch"]
torch-cu126 = ["torch"]
torch-cu130 = ["torch"]
omikuji = ["omikuji==0.5.*"]
spacy = [
    "spacy~=3.8.4",
    "pip>=25.3",
]
stwfsa = ["stwfsapy~=0.6.1"]
voikko = ["voikko==0.5.*"]
yake = ["yake~=0.7.3"]

[project.urls]
homepage = "https://annif.org"
repository = "https://github.com/NatLibFi/Annif"
documentation = "https://github.com/NatLibFi/Annif/wiki"

[project.scripts]
annif = "annif.cli:cli"

[dependency-groups]
dev = [
    "py",
    "pytest==9.*",
    "pytest-cov",
    "pytest-watch",
    "pytest-flask",
    "flake8",
    "bumpversion",
    "black==25.*",
    "isort",
    "schemathesis~=4.27.2",
]
all = ["annif[fasttext,estnltk,nn,omikuji,spacy,stwfsa,voikko,yake]"]

[tool.isort]
profile = "black"
line_length = "88"
skip_gitignore = true

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "-m 'not slow'"

[tool.uv]
exclude-newer = "5 days"
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cu126" },
    { extra = "torch-cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",    extra = "torch-cpu" },
  { index = "pytorch-cu126",  extra = "torch-cu126" },
  { index = "pytorch-cu130",  extra = "torch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

name: CI/CD
on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  workflow_dispatch:
env:
  UV_VERSION: "0.9.*"
permissions:
  contents: read
jobs:

  lint:
    runs-on: ubuntu-22.04
    name: lint with isort, Black & flake8
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Prepare: restore caches, install uv, set up Python"
      uses: ./.github/actions/prepare
      with:
        python-version: "3.12"
        uv-version: ${{ env.UV_VERSION }}
    - name: Install Python dev dependencies
      run: |
        uv sync --only-dev
    - name: Lint with isort
      run: |
        uv run isort . --check-only --diff
    - name: Lint with Black
      run: |
        uv run black . --check --diff
    - name: Lint with flake8
      run: |
        uv run flake8

  time-startup:
    runs-on: ubuntu-22.04
    name: check CLI startup time
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Prepare: restore caches, install uv, set up Python"
      id: prepare
      uses: ./.github/actions/prepare
      with:
        python-version: "3.11"
        uv-version: ${{ env.UV_VERSION }}
    - name: Install Python dependencies
      run: |
        uv sync
    - name: Check startup time
      run: |
        uv run tests/time-startup.sh

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: test on Python ${{ matrix.python-version }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install system packages
      run: |
        sudo apt-get install \
          libvoikko1 \
          voikko-fi
    - name: "Prepare: restore caches, install uv, set up Python"
      id: prepare
      uses: ./.github/actions/prepare
      with:
        python-version: ${{ matrix.python-version }}
        uv-version: ${{ env.UV_VERSION }}
    - name: Install Python dependencies
      run: |
        # Selectively install the optional dependencies for some Python versions
        # For Python 3.10:
        if [[ ${{ matrix.python-version }} == '3.10' ]]; then
          uv sync --extra nn --extra torch-cpu --extra omikuji --extra yake --extra voikko --extra stwfsa;
        fi
        # For Python 3.11:
        if [[ ${{ matrix.python-version }} == '3.11' ]]; then
          uv sync --extra fasttext --extra spacy --extra estnltk;
          # download the small English pretrained spaCy model needed by spacy analyzer
          uv run python -m spacy download en_core_web_sm --upgrade-strategy only-if-needed
        fi
        # For Python 3.12:
        if [[ ${{ matrix.python-version }} == '3.12' ]]; then
          uv sync --extra nn --extra torch-cpu --extra fasttext --extra yake --extra stwfsa --extra voikko --extra spacy;
          # download the small English pretrained spaCy model needed by spacy analyzer
          uv run python -m spacy download en_core_web_sm --upgrade-strategy only-if-needed
        fi
        # For Python 3.13:
        if [[ ${{ matrix.python-version }} == '3.13' ]]; then
          uv sync --extra fasttext --extra yake --extra voikko --extra spacy;
          # download the small English pretrained spaCy model needed by spacy analyzer
          uv run python -m spacy download en_core_web_sm --upgrade-strategy only-if-needed
        fi
        uv run python -m nltk.downloader punkt_tab
    - name: Test with pytest
      run: |
        uv run pytest --cov=./ --cov-report xml
        if [[ ${{ matrix.python-version }} == '3.11' ]]; then
          uv run pytest --cov=./ --cov-report xml --cov-append -m slow
        fi
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-docker-image:
    name: "test Docker image"
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: "Build image for testing"
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        push: false
        tags: test-image
    - name: "Test with pytest"
      run: |
        docker run --rm --workdir /Annif test-image pytest -p no:cacheprovider

  publish-docker-latest:
    name: publish latest Docker image
    needs: [lint, test, test-docker-image]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: quay.io
        username: ${{ secrets.YHTEENTOIMIVUUSPALVELUT_QUAY_IO_USERNAME }}
        password: ${{ secrets.YHTEENTOIMIVUUSPALVELUT_QUAY_IO_PASSWORD }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: quay.io/natlibfi/annif
        tags: |
          latest
    - name: Build and push to Quay.io
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: publish release
    needs: [lint, test, test-docker-image]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/annif/
    permissions:
      id-token: write
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: "Prepare: restore caches, install uv, set up Python"
      uses: ./.github/actions/prepare
      with:
        python-version: '3.11'
        uv-version: ${{ env.UV_VERSION }}
    - name: Build distributions
      run: |
        uv build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

    - name: Login to Quay.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: quay.io
        username: ${{ secrets.YHTEENTOIMIVUUSPALVELUT_QUAY_IO_USERNAME }}
        password: ${{ secrets.YHTEENTOIMIVUUSPALVELUT_QUAY_IO_PASSWORD }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: quay.io/natlibfi/annif
        tags: |
          type=semver,pattern={{version}},suffix=-{{date 'YYYYMMDD'}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Build and push to Quay.io
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
